services:
  - type: web
    name: exam-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: exam-server-db
          property: connectionString

databases:
  - name: exam-server-db
    plan: basic-256mb
